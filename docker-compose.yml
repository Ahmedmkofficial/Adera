services:
  db:
    image: postgres:16-alpine
    container_name: adera-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-adera_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-your_password}
      POSTGRES_DB: ${POSTGRES_DB:-adera_db}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - adera_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-adera_user} -d $${POSTGRES_DB:-adera_db}"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 5s

volumes:
  adera_pgdata:
    driver: local
